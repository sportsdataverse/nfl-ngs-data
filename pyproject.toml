[project]
name = "nfl-ngs-data-build"
version = "0.1.0"
description = "Python producer for the nfl_ngs_* release datasets (reshapes the nfl-ngs-raw Next Gen Stats JSON tree, read over HTTPS)."
requires-python = ">=3.11"
dependencies = [
    # dl_utils.download (pooled session + retry/backoff) + release.upload_release_sidecars.
    "sportsdataverse @ git+https://github.com/sportsdataverse/sportsdataverse-py@main",
    "polars>=1.0,<2.0",
    "pyarrow>=15.0",
    "requests>=2.28",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# python/ is the source dir. The numbered ngs_NN_*_creation.py entrypoints sit
# beside the package and are run by path; the package itself is what gets installed.
[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
markers = ["archive: dated one-off probes, not run in CI"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E712"]
